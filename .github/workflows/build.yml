name: Build APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
        pip install --upgrade pip
        pip install buildozer cython==0.29.36

    - name: Build with Buildozer
      env:
        BUILDER_ACCEPT_LICENSES: "1"
      run: |
        # تثبيت حزم أدوات سطر الأوامر وقبول التراخيص مسبقاً
        mkdir -p ~/.buildozer/android/platform/android-sdk
        yes | buildozer -v android debug || true
        # محاولة البناء مرة أخرى بعد تثبيت الحزم وقبول الرخص
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
